<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Livro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>
    <h2>Adicionar Livro</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}
    {% endwith %}


    <form action="/criar" method="post" class="form-livro" enctype="multipart/form-data">

        <label for="imagem">Capa do Livro</label>
        <input type="file" id="imagem" name="imagem" accept=".jpg" required>

        <label for="titulo">Título</label>
        <input type="text" id="titulo"  name="titulo" placeholder="Digite o nome do livro" required>

        <label for="autor">Autor</label>
        <input type="text" id="autor" name="autor" placeholder="Digite o autor do livro" required>

        <label for="data_publicacao">Data publicação</label>
        <input type="number" id="data_publicacao" name="data_publicacao" placeholder="Digite a data de publicação do livro" required>

        <button type="submit">Adicionar livro</button>

    </form>



</body>
</html>
